<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --gold: #c9a45c;
    --gold-soft: rgba(201, 164, 92, .75);
    --card: rgba(18, 18, 18, .88);
    --btn: rgba(24, 28, 28, .92);
    --white: #fbf8f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Cinzel", Georgia, serif;
    color: var(--white);
    background: #0d0b09 url("fond.jpg") center / cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 90px 20px 40px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 3px solid var(--gold);
    border-radius: 28px;
    padding: 90px 26px 34px;
    box-shadow: 0 0 40px rgba(201, 164, 92, .18), 0 20px 50px rgba(0, 0, 0, .6);
    text-align: center;
  }
  .logo {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 4px #1a1a1a, 0 0 0 5px var(--gold-soft), 0 8px 22px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
  h1 {
    font-weight: 400;
    font-size: 26px;
    letter-spacing: .03em;
    margin-bottom: 34px;
  }
  .links { display: flex; flex-direction: column; gap: 22px; }
  .links a {
    display: block;
    padding: 14px 10px;
    background: var(--btn);
    border: 1px solid var(--gold);
    border-radius: 12px;
    color: var(--white);
    text-decoration: none;
    font-weight: 700;
    font-size: 15.5px;
    letter-spacing: .02em;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .links a:hover, .links a:focus-visible {
    transform: translateY(-2px);
    background: rgba(40, 34, 24, .95);
    box-shadow: 0 0 16px rgba(201, 164, 92, .35);
    outline: none;
  }
  .social { display: flex; justify-content: center; gap: 22px; margin-top: 40px; }
  .social a {
    color: var(--gold);
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, opacity .15s ease;
  }
  .social a:hover, .social a:focus-visible { transform: scale(1.12); opacity: .85; outline: none; }
  .social svg { width: 100%; height: 100%; fill: currentColor; }
  @media (max-width: 400px) { .links a { font-size: 14.5px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
